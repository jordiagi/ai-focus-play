openapi: 3.1.0
info:
  title: Real Player Evidence API
  version: 0.3.0
  description: >
    Contract updates for replacing synthetic player evidence with real video-backed
    evidence samples, candidate identities, confirmation gating, and traceable
    reel generation.
servers:
  - url: http://localhost:8000
paths:
  /projects/{projectId}/player-request:
    post:
      summary: Start or rerun real video evidence search for a target jersey number
      operationId: requestRealPlayerEvidence
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPlayerRequestInput'
      responses:
        '202':
          description: Evidence search accepted, processing, or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidedProject'
        '409':
          description: Project has no selected source or is not ready for player confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '422':
          description: Jersey number is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /projects/{projectId}/player-candidates:
    get:
      summary: List real evidence-backed candidate player identities
      operationId: listRealPlayerCandidates
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Candidate identities with supporting real evidence samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending_evidence, processing, candidates_ready, no_candidates, failed]
                  message:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CandidatePlayerIdentity'
                required: [status, items]
  /projects/{projectId}/evidence-media/{artifactName}:
    get:
      summary: Serve a generated evidence thumbnail, frame, or short clip
      operationId: getEvidenceMedia
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: path
          name: artifactName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Generated project-scoped evidence media
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          description: Evidence media not found for this project
  /projects/{projectId}/player-confirmation:
    post:
      summary: Confirm, reject, or mark a real evidence-backed candidate as insufficient
      operationId: confirmRealPlayerCandidate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerConfirmationRequest'
      responses:
        '200':
          description: Confirmation decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidedProject'
        '409':
          description: Candidate is not backed by real evidence or cannot unlock extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /projects/{projectId}/exports:
    post:
      summary: Generate a reel after real evidence-backed player confirmation
      operationId: createEvidenceBackedReel
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReelRequest'
      responses:
        '202':
          description: Reel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReelRequest'
        '409':
          description: Player identity has not been confirmed from real evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
  schemas:
    TargetPlayerRequestInput:
      type: object
      properties:
        jersey_number:
          type: string
          minLength: 1
        optional_team_hint:
          type: string
      required: [jersey_number]
    CandidatePlayerIdentity:
      type: object
      properties:
        candidate_id:
          type: string
        jersey_number:
          type: string
        inferred_team_color:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        review_state:
          type: string
          enum: [candidate, confirmed, rejected, insufficient]
        evidence_count:
          type: integer
          minimum: 1
        visible_cues:
          type: array
          items:
            type: string
            enum: [jersey_number, jersey_color, body_shape, cleats, team_context]
        cue_summary:
          type: string
        match_reasons:
          type: array
          items:
            type: string
        review_warning:
          type: string
        samples:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceSample'
      required:
        - candidate_id
        - jersey_number
        - confidence
        - review_state
        - evidence_count
        - visible_cues
        - cue_summary
        - samples
      examples:
        - candidate_id: c1
          jersey_number: "8"
          inferred_team_color: blue
          confidence: 0.45
          review_state: candidate
          evidence_count: 1
          visible_cues: [jersey_color, team_context]
          cue_summary: "Real source-video evidence at 1064.2s for visual review of jersey #8."
          match_reasons:
            - "Real source-video sample selected for human review of jersey #8."
          review_warning: "Jersey number and color were not automatically verified; confirm visually from the real video evidence."
          samples:
            - evidence_sample_id: s1
              sample_type: clip
              timestamp_seconds: 1064.2
              start_seconds: 1062.7
              end_seconds: 1065.7
              media_uri: /projects/p1/evidence-media/evidence-1-a1b2c3d4e5.mp4
              thumbnail_uri: /projects/p1/evidence-media/evidence-1-a1b2c3d4e5.jpg
              origin: source_video
              jersey_number_status: unknown
              jersey_color_status: unknown
              visible_cues: [jersey_color, team_context]
              cue_summary: "Real source-video evidence at 1064.2s for visual review of jersey #8."
    EvidenceSample:
      type: object
      properties:
        evidence_sample_id:
          type: string
        sample_type:
          type: string
          enum: [frame, clip]
        timestamp_seconds:
          type: number
          minimum: 0
        start_seconds:
          type: number
          minimum: 0
        end_seconds:
          type: number
          minimum: 0
        media_uri:
          type: string
        thumbnail_uri:
          type: string
        origin:
          type: string
          enum: [source_video]
        jersey_number_status:
          type: string
          enum: [matched, not_matched, unknown, not_visible]
        jersey_color_status:
          type: string
          enum: [matched, not_matched, unknown, not_visible]
        visible_cues:
          type: array
          items:
            type: string
        cue_summary:
          type: string
      required:
        - evidence_sample_id
        - sample_type
        - timestamp_seconds
        - media_uri
        - thumbnail_uri
        - origin
        - jersey_number_status
        - jersey_color_status
        - visible_cues
        - cue_summary
      examples:
        - evidence_sample_id: s1
          sample_type: clip
          timestamp_seconds: 1064.2
          start_seconds: 1062.7
          end_seconds: 1065.7
          media_uri: /projects/p1/evidence-media/evidence-1-a1b2c3d4e5.mp4
          thumbnail_uri: /projects/p1/evidence-media/evidence-1-a1b2c3d4e5.jpg
          origin: source_video
          jersey_number_status: unknown
          jersey_color_status: unknown
          visible_cues: [team_context]
          cue_summary: "Real source-video evidence at 1064.2s for visual review of jersey #8."
    PlayerConfirmationRequest:
      type: object
      properties:
        candidate_id:
          type: string
        decision:
          type: string
          enum: [confirm, reject, insufficient]
      required: [candidate_id, decision]
    GuidedProject:
      type: object
      properties:
        project_id:
          type: string
        status:
          type: string
        workflow_step:
          type: string
          enum: [choose_source, confirm_player, generate_reels, complete]
        target_player_request:
          type: object
        player_identity_profile:
          type: object
        progress:
          type: object
          properties:
            stage:
              type: string
            percent:
              type: number
            message:
              type: string
      required: [project_id, status, workflow_step]
    CreateReelRequest:
      type: object
      properties:
        output_profile:
          type: string
          enum: [short_highlight, medium_best_plays]
        target_marker:
          type: boolean
          default: false
      required: [output_profile]
    ReelRequest:
      type: object
      properties:
        output_id:
          type: string
        project_id:
          type: string
        output_profile:
          type: string
        verification_status:
          type: string
        download_uri:
          type: string
      required: [output_id, project_id, output_profile, verification_status]
    ValidationError:
      type: object
      properties:
        detail:
          type: string
      required: [detail]
