[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-focus-play-backend"
version = "0.1.0"
description = "Backend API and worker services for player-focused soccer reel generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.12",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
ml = [
  "torch>=2.5,<3",
  "torchvision>=0.20",
  "transformers>=4.48,<5",
  "huggingface_hub>=0.27",
  "supervision>=0.25",
  "sam2>=1.1",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "nltk>=3.7",
  "pillow>=10",
  "pytorch-lightning>=2.2,<3",
  "scikit-learn>=1.5",
  "timm>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "ml: requires optional ML dependencies and downloaded model weights",
]
